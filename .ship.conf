# Read by `ship` (~/projects/_ops/bin/ship.sh). The version the running brain must report on /health.
VERSION_FILE=backend/package.json
HEALTH_URL=http://127.0.0.1:3001/health
# Porter runs from source (npx tsx src/index.ts), so deploying a landing is a restart. A merge commit
# fires no deploy of its own; without this, 6.162.1 landed and the brain kept serving 6.162.0.
DEPLOY_CMD="systemctl --user restart porter-fastify.service"
MAIN_BRANCH=master
